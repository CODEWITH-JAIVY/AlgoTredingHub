name: backend-ci
on:
  push:
    paths: ["services/backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["services/backend/**", ".github/workflows/backend-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests
        working-directory: services/backend
        run: bash mvnw -B test