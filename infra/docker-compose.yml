services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: algotrade
      POSTGRES_USER: algotrade
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algotrade -d algotrade"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build:
      context: ../services/backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/algotrade
      DATABASE_USER: algotrade
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set JWT_SECRET_BASE64 in .env}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,chrome-extension://placeholder},http://tauri.localhost,http://127.0.0.1:1420"
      APP_SINGLE_USER_MODE: ${APP_SINGLE_USER_MODE:-true}
      TRADING_MODE: MOCK
      SERVER_PORT: 8080
      ANALYSIS_BASE_URL: http://analysis:8000
      ANALYSIS_INTERNAL_TOKEN: ${ANALYSIS_INTERNAL_TOKEN:?Set ANALYSIS_INTERNAL_TOKEN in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  analysis:
    build:
      context: ../services/analysis
    environment:
      ANALYSIS_INTERNAL_TOKEN: ${ANALYSIS_INTERNAL_TOKEN:?Set ANALYSIS_INTERNAL_TOKEN in .env}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
volumes:
  postgres_data:
  redis_data:
